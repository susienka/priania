<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Vianočné Zoznamy Darčekov 🎁</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body { 
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      color: #0f172a; 
      padding: 40px 20px; 
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
    }

    .container { 
      width: 100%; 
      max-width: 800px; 
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      padding: 40px; 
      border-radius: 28px; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2); 
      border-top: 6px solid #e11d48;
    }

    .main-title { 
      font-size: 32px; 
      font-weight: 800; 
      text-align: center; 
      margin-bottom: 32px; 
      background: linear-gradient(135deg, #0f172a 0%, #e11d48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    
    /* LOGIN UI */
    .login-box { text-align: center; padding: 40px 20px; }
    .login-box p { color: #64748b; font-size: 18px; margin-bottom: 24px; font-weight: 500; }
    
    .input-field { 
      width: 100%; 
      padding: 18px 22px; 
      border: 2px solid #e2e8f0; 
      border-radius: 16px; 
      font-size: 16px; 
      outline: none; 
      transition: all 0.2s ease; 
      background: #f8fafc; 
      color: #0f172a;
      font-weight: 500;
    }

    .login-box .input-field {
      max-width: 360px;
      text-align: center;
      font-size: 20px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .input-field:focus { 
      border-color: #e11d48; 
      background: #ffffff; 
      box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.12); 
    }
    
    .btn-primary { 
      width: 100%; 
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); 
      color: #ffffff; 
      border: none; 
      padding: 18px; 
      border-radius: 16px; 
      font-size: 17px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 10px 20px -5px rgba(225, 29, 72, 0.4); 
    }

    .login-box .btn-primary { max-width: 360px; }

    .btn-primary:hover { 
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -5px rgba(225, 29, 72, 0.5); 
    }

    /* HEADER */
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #fff1f2; 
      border: 1px solid #ffe4e6; 
      padding: 18px 24px; 
      border-radius: 20px; 
      margin-bottom: 32px; 
      gap: 12px;
    }

    .user-badge { 
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px; 
      color: #9f1239; 
      font-weight: 600; 
      word-break: break-word;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: #e11d48;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    .logout-btn { 
      width: auto; 
      background: #64748b; 
      padding: 10px 20px; 
      font-size: 14px; 
      border-radius: 12px; 
      color: white; 
      border: none; 
      font-weight: 600;
      cursor: pointer; 
      transition: 0.2s; 
      flex-shrink: 0;
    }

    .logout-btn:hover { background: #475569; }

    /* MEMBERS GRID */
    .section-title { 
      font-size: 13px; 
      font-weight: 800; 
      text-transform: uppercase; 
      color: #94a3b8; 
      letter-spacing: 0.08em; 
      margin-bottom: 16px; 
      margin-top: 28px; 
    }

    .members-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
      gap: 10px; 
      margin-bottom: 32px; 
    }

    .member-card { 
      background: #f8fafc; 
      border: 2px solid #f1f5f9; 
      border-radius: 16px; 
      padding: 14px 10px; 
      text-align: center; 
      font-weight: 700; 
      font-size: 14px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      color: #475569; 
    }

    .member-card:hover { 
      border-color: #fda4af; 
      background: #fff1f2; 
      color: #e11d48; 
      transform: translateY(-2px); 
    }

    .member-card.active { 
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); 
      color: white; 
      border-color: #e11d48; 
      box-shadow: 0 8px 16px -4px rgba(225, 29, 72, 0.4); 
    }

    /* GIFTS LIST */
    .gift-item { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 20px; 
      padding: 18px 20px; 
      margin-bottom: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 15px; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .gift-item:hover { 
      border-color: #cbd5e1; 
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); 
    }

    .gift-info { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      word-break: break-word; 
      flex-grow: 1; 
    }

    .gift-title { 
      font-weight: 700; 
      font-size: 17px; 
      color: #0f172a; 
    }

    .gift-link { 
      font-size: 14px; 
      color: #2563eb; 
      text-decoration: none; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      font-weight: 600; 
      margin-top: 2px; 
    }

    .gift-link:hover { text-decoration: underline; }
    
    .gift-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    button { cursor: pointer; border: none; font-weight: 700; border-radius: 14px; transition: 0.2s; }

    .btn-reserve { 
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
      color: white; 
      font-size: 14px; 
      padding: 12px 18px; 
      white-space: nowrap; 
      box-shadow: 0 6px 16px -4px rgba(16, 185, 129, 0.4); 
    }

    .btn-reserve:hover { transform: translateY(-1px); background: #059669; }
    
    .btn-cancel { 
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); 
      color: white; 
      font-size: 14px; 
      padding: 12px 18px; 
      white-space: nowrap; 
      box-shadow: 0 6px 16px -4px rgba(245, 158, 11, 0.4); 
    }

    .btn-cancel:hover { transform: translateY(-1px); background: #d97706; }

    .btn-delete { 
      background: #f1f5f9; 
      color: #ef4444; 
      font-size: 14px; 
      padding: 12px 16px; 
      white-space: nowrap; 
    }

    .btn-delete:hover { background: #fee2e2; color: #dc2626; }
    
    .status-badge { 
      font-size: 13px; 
      font-weight: 700; 
      color: #64748b; 
      background: #f1f5f9; 
      padding: 10px 14px; 
      border-radius: 12px; 
      white-space: nowrap; 
    }

    /* FORM CONTAINER */
    .add-box { 
      margin-top: 36px; 
      padding-top: 32px; 
      border-top: 2px dashed #e2e8f0; 
    }

    .add-form-grid { 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }

    .hidden { display: none !important; }

    /* MOBILNÁ OPTIMALIZÁCIA (Media Queries) */
    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
      }

      .container {
        padding: 20px 16px;
        border-radius: 20px;
      }

      .main-title {
        font-size: 26px;
        margin-bottom: 24px;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 14px 16px;
      }

      .logout-btn {
        width: 100%;
        text-align: center;
        padding: 12px;
      }

      .gift-item {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 16px;
      }

      .gift-actions {
        justify-content: flex-end;
      }

      .btn-reserve, .btn-cancel, .btn-delete, .status-badge {
        width: 100%;
        text-align: center;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="main-title">🎄 Vianočné Zoznamy 🎁</h1>

  <!-- PRIHLÁSENIE -->
  <div id="login-section" class="login-box">
    <p>Zadaj svoje rodinné ID na prihlásenie:</p>
    <input type="text" id="user-id-input" class="input-field" placeholder="napr. X010L" autofocus>
    <br>
    <button class="btn-primary" onclick="login()">Vstúpiť do portálu</button>
  </div>

  <!-- APLIKÁCIA -->
  <div id="app-section" class="hidden">
    <div class="header">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <div>Prihlásený/á ako: <strong id="current-user-name" style="color: #e11d48;"></strong></div>
      </div>
      <button class="logout-btn" onclick="logout()">Odhlásiť</button>
    </div>

    <!-- ZOZNAM ČLENOV RODINY -->
    <div class="section-title">Vyber čí zoznam chceš pozrieť:</div>
    <div class="members-grid" id="members-grid"></div>

    <!-- ZOZNAM DARČEKOV ZVOLENÉHO ČLENA -->
    <div class="section-title" id="selected-list-title">Darčeky</div>
    <div id="gifts-list"></div>

    <!-- FORMULÁR NA PRIDANIE VLASTNÉHO DARČEKA DOLE -->
    <div class="add-box">
      <div class="section-title">➕ Pridať darček do svojho zoznamu</div>
      <div class="add-form-grid">
        <input type="text" id="new-gift-input" class="input-field" placeholder="Názov darčeka (napr. Kniha, Sveter...)">
        <input type="text" id="new-gift-link" class="input-field" placeholder="Odkaz na e-shop (nepovinné, napr. alza.sk/...)">
        <button class="btn-primary" onclick="addGift()">Pridať prianie pod stromček 🌲</button>
      </div>
    </div>
  </div>
</div>

<script>
  const users = [
    { id: "L01O", name: "Leo" },
    { id: "E02A", name: "Mamka" },
    { id: "A03R", name: "Ocko" },
    { id: "E40K", name: "Brat" },
    { id: "S05A", name: "Sestra" },
    { id: "A06X", name: "Alex" },
    { id: "S07Y", name: "Stelly" }
  ];

  const SUPABASE_URL = 'https://quueswcvqoldttniacxm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-vAk4wPgVqeH-sfDdnX8Eg_33-bL3Gu';

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  let currentUser = null;
  let activeTargetUser = null;

  function login() {
    const enteredId = document.getElementById('user-id-input').value.trim();
    const foundUser = users.find(u => u.id === enteredId);

    if (!foundUser) {
      alert("Nesprávne ID! Skontroluj zadané číslo.");
      return;
    }

    currentUser = foundUser;
    activeTargetUser = foundUser.name;

    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    document.getElementById('current-user-name').innerText = `${currentUser.name}`;
    document.getElementById('user-avatar').innerText = currentUser.name.charAt(0);

    renderMembersGrid();
    renderGifts();
  }

  function logout() {
    currentUser = null;
    activeTargetUser = null;
    document.getElementById('user-id-input').value = '';
    document.getElementById('login-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
  }

  function renderMembersGrid() {
    const grid = document.getElementById('members-grid');
    grid.innerHTML = '';

    users.forEach(u => {
      const card = document.createElement('div');
      card.className = `member-card ${u.name === activeTargetUser ? 'active' : ''}`;
      card.innerText = u.name === currentUser.name ? `${u.name} (Ja)` : u.name;
      card.onclick = () => {
        activeTargetUser = u.name;
        renderMembersGrid();
        renderGifts();
      };
      grid.appendChild(card);
    });
  }

  async function addGift() {
    const inputTitle = document.getElementById('new-gift-input');
    const inputLink = document.getElementById('new-gift-link');
    const title = inputTitle.value.trim();
    let link = inputLink.value.trim();

    if (!title) return alert("Zadaj názov darčeka!");

    if (link && !link.startsWith('http://') && !link.startsWith('https://')) {
      link = 'https://' + link;
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/gifts`, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          id: Date.now().toString(),
          owner: currentUser.name,
          title: title,
          link: link,
          reserved_by: ""
        })
      });

      if (!res.ok) {
        const err = await res.json();
        alert("Chyba pri ukladaní: " + (err.message || res.statusText));
        return;
      }

      inputTitle.value = '';
      inputLink.value = '';
      
      activeTargetUser = currentUser.name;
      renderMembersGrid();
      renderGifts();
    } catch (e) {
      alert("Chyba pripojenia k databáze.");
    }
  }

  async function deleteGift(giftId) {
    if (!confirm("Naozaj chceš vymazať toto prianie?")) return;
    
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/gifts?id=eq.${giftId}`, {
        method: 'DELETE',
        headers: headers
      });

      if (!res.ok) alert("Chyba pri mazaní!");
      renderGifts();
    } catch (e) {
      alert("Chyba pripojenia.");
    }
  }

  async function reserveGift(giftId, currentReservedBy) {
    let newReservedBy = "";

    if (!currentReservedBy) {
      newReservedBy = currentUser.name;
    } else if (currentReservedBy === currentUser.name) {
      newReservedBy = "";
    } else {
      alert("Tento darček už rezervoval niekto iný!");
      return;
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/gifts?id=eq.${giftId}`, {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({ reserved_by: newReservedBy })
      });

      if (!res.ok) alert("Chyba pri rezervácii!");
      renderGifts();
    } catch (e) {
      alert("Chyba pripojenia.");
    }
  }

  async function renderGifts() {
    const listDiv = document.getElementById('gifts-list');
    document.getElementById('selected-list-title').innerText = `Zoznam darčekov: ${activeTargetUser}`;
    listDiv.innerHTML = '<p style="text-align:center; color: #94a3b8; padding: 20px 0;">Načítavam...</p>';

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/gifts?owner=eq.${encodeURIComponent(activeTargetUser)}&select=*`, {
        method: 'GET',
        headers: headers
      });

      if (!res.ok) {
        listDiv.innerHTML = '<p style="text-align:center; color: #ef4444; padding: 20px 0;">Chyba pri načítaní darčekov.</p>';
        return;
      }

      const targetGifts = await res.json();
      listDiv.innerHTML = '';

      const isMyOwnList = (currentUser.name === activeTargetUser);

      if (!targetGifts || targetGifts.length === 0) {
        listDiv.innerHTML = '<p style="text-align:center; color: #94a3b8; padding: 30px 0; font-size: 16px; font-weight: 500;">Zatiaľ tu nie sú žiadne vianočné priania 🎄.</p>';
        return;
      }

      targetGifts.forEach(gift => {
        const item = document.createElement('div');
        item.className = 'gift-item';

        let linkHtml = gift.link ? `<a href="${gift.link}" target="_blank" class="gift-link">🔗 Kde kúpiť darček</a>` : '';
        let rightContent = '';

        if (isMyOwnList) {
          rightContent = `
            <div class="gift-actions">
              <span class="status-badge">Tvoje prianie</span>
              <button class="btn-delete" onclick="deleteGift('${gift.id}')">🗑️ Vymazať</button>
            </div>
          `;
        } else {
          if (gift.reserved_by === currentUser.name) {
            rightContent = `<button class="btn-cancel" onclick="reserveGift('${gift.id}', '${gift.reserved_by}')">Zrušiť rezerváciu</button>`;
          } else if (gift.reserved_by) {
            rightContent = `<span class="status-badge">❌ Už rezervované</span>`;
          } else {
            rightContent = `<button class="btn-reserve" onclick="reserveGift('${gift.id}', '${gift.reserved_by}')">🎁 Rezervovať</button>`;
          }
        }

        item.innerHTML = `
          <div class="gift-info">
            <div class="gift-title">${gift.title}</div>
            ${linkHtml}
          </div>
          <div>${rightContent}</div>
        `;
        listDiv.appendChild(item);
      });
    } catch (e) {
      listDiv.innerHTML = '<p style="text-align:center; color: #ef4444; padding: 20px 0;">Chyba pripojenia k serveru.</p>';
    }
  }
</script>
</body>
</html>
